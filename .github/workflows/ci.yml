name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git rust cargo base-devel gtk4 libadwaita xorg-server-xvfb xorg-xauth

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo check
        run: cargo check --all-targets

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test (including GTK layout on Xvfb)
        run: xvfb-run -a cargo test
