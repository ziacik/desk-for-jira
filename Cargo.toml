[package]
name = "desk-for-jira"
version = "0.1.0"
edition = "2024"
description = "A native GNOME desktop client for Jira issues and boards"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
